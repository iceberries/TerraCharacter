modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''Independent characters, appearance editing, difficulty rules and world selection for singleplayer and multiplayer Minecraft.'''

[[mixins]]
config="terra_character.mixins.json"

[[mixins]]
config="terra_character_confluence.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="confluence"
type="optional"
versionRange="[${confluence_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="terra_character_confluence"
type="incompatible"
versionRange="[0,)"
reason="Confluence integration is built into Terra Character; remove the old Terra Character: Confluence jar."
ordering="NONE"
side="BOTH"
